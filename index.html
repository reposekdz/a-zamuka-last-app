<!DOCTYPE html>
<html lang="rw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zamuka Microfinance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'rw-blue': '#2060A8',
              'rw-yellow': '#F9D700',
              'rw-green': '#009739',
            },
            animation: {

            keyframes: {

            }
          },
        },
      }
    </script>

  }
}

<style>
    body {
        background-color: #f8fafc; /* Tailwind's bg-slate-50 */
    }
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    .animate-fade-in-up {
